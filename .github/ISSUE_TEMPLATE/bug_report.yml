name: Bug report
description: Report a problem
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected vs. what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - desktop
        - runtime
        - web
        - ios
        - backend
        - other
